apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  namespace: cog
  labels:
    app: reports-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports-service
  template:
    metadata:
      labels:
        app: reports-service
    spec:
      containers:
        - name: reports-service
          image: ${ECR_REGISTRY}/cog/reports-service:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: cog-db-secret
                  key: reports-connection-string
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: cog-jwt-secret
                  key: secret-key
            - name: Jwt__Issuer
              value: "cog-auth-service"
            - name: Jwt__Audience
              value: "cog-services"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reports-service
  namespace: cog
spec:
  selector:
    app: reports-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reports-service-hpa
  namespace: cog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reports-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
