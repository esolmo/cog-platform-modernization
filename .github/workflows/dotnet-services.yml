name: .NET Services CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'modernization/shared/domain/**'
      - 'modernization/auth-service/**'
      - 'modernization/betting-service/**'
      - 'modernization/accounts-service/**'
      - 'modernization/admin-service/**'
      - 'modernization/alerts-service/**'
      - 'modernization/lottery-service/**'
      - 'modernization/reports-service/**'
  pull_request:
    # Run tests on ALL pull requests to main/develop regardless of path — per project policy
    branches: [main, develop]

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  DOTNET_VERSION: '8.0.x'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth:     ${{ steps.filter.outputs.auth }}
      betting:  ${{ steps.filter.outputs.betting }}
      accounts: ${{ steps.filter.outputs.accounts }}
      admin:    ${{ steps.filter.outputs.admin }}
      alerts:   ${{ steps.filter.outputs.alerts }}
      lottery:  ${{ steps.filter.outputs.lottery }}
      reports:  ${{ steps.filter.outputs.reports }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:     ['modernization/auth-service/**', 'modernization/shared/domain/**']
            betting:  ['modernization/betting-service/**', 'modernization/shared/domain/**']
            accounts: ['modernization/accounts-service/**', 'modernization/shared/domain/**']
            admin:    ['modernization/admin-service/**', 'modernization/shared/domain/**']
            alerts:   ['modernization/alerts-service/**', 'modernization/shared/domain/**']
            lottery:  ['modernization/lottery-service/**', 'modernization/shared/domain/**']
            reports:  ['modernization/reports-service/**', 'modernization/shared/domain/**']

  build-test-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore auth-service/AuthService.sln
      - name: Build
        run: dotnet build auth-service/AuthService.sln --no-restore -c Release
      - name: Test
        run: dotnet test auth-service/AuthService.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: modernization/coverage

  build-push-auth:
    needs: build-test-auth
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        working-directory: modernization
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build -t $REGISTRY/cog/auth-service:$IMAGE_TAG -f auth-service/Dockerfile .
          docker push $REGISTRY/cog/auth-service:$IMAGE_TAG
          docker tag $REGISTRY/cog/auth-service:$IMAGE_TAG $REGISTRY/cog/auth-service:latest
          docker push $REGISTRY/cog/auth-service:latest

  deploy-auth-dev:
    needs: build-push-auth
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name cog-dev-cluster --region ${{ secrets.AWS_REGION }}
      - name: Deploy to EKS
        working-directory: modernization/auth-service/k8s
        run: |
          export ECR_REGISTRY=$REGISTRY
          export IMAGE_TAG=${GITHUB_SHA::8}
          envsubst < deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/auth-service -n cog --timeout=300s

